
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali Surprise For Tanu ❤️</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#09051c;
 font-family:Georgia,serif;
}
canvas{display:block}
#loading{
 position:fixed;inset:0;
 display:grid;place-items:center;
 color:gold;background:#09051c;
 z-index:10;font-size:20px;
}
#caption{
 position:fixed;bottom:12%;
 left:0;width:100%;text-align:center;
 color:#ffe6a0;font-size:19px;
 text-shadow:0 0 15px orange;
 opacity:0;transition:opacity 1.5s;
 padding:15px;pointer-events:none;
}
#final{
 position:fixed;inset:0;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;padding:20px;
 background:#170024dd;
 opacity:0;pointer-events:none;
 transition:opacity 2s;
 color:white;z-index:5;
}
#final h1{
 color:#ffe27b;
 font-size:clamp(32px,8vw,65px);
 text-shadow:0 0 25px orange;
 animation:glow 1.5s infinite alternate;
}
#final p{
 font-size:20px;line-height:1.8;
 max-width:500px;
}
#final .emoji{font-size:45px}
@keyframes glow{
 to{text-shadow:0 0 40px gold,0 0 60px orange}
}
</style>
</head>

<body>

<div id="loading">🪔 Preparing Tanu's Surprise...</div>
<div id="caption"></div>

<div id="final">
 <div class="emoji">🪔🎆❤️🎆🪔</div>
 <h1>HAPPY DIWALI TANU!</h1>
 <p>
 My sweetest sister ❤️🥹<br><br>
 May your life always shine brighter
 than these beautiful lights.
 May every dream come true and
 happiness always surround you.<br><br>
 You are truly special.
 Keep smiling and keep shining!<br><br>
 <b>LOVE YOU SO MUCH TANU! 😘🫂</b>
 </p>
 <div class="emoji">❤️♾️💋</div>
</div>

<div id="world"></div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08051d);
scene.fog=new THREE.Fog(0x08051d,18,65);

const camera=new THREE.PerspectiveCamera(
 60,innerWidth/innerHeight,.1,100
);
camera.position.set(0,3,14);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.getElementById("world").appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.AmbientLight(0x9c9cdd,1.1));

const moonLight=new THREE.DirectionalLight(0xb6b8ff,1.6);
moonLight.position.set(-8,15,5);
moonLight.castShadow=true;
scene.add(moonLight);

const homeLight=new THREE.PointLight(0xffa32c,0,22);
homeLight.position.set(0,5,-14);
scene.add(homeLight);

// MATERIALS
function material(color,emissive=0x000000){
 return new THREE.MeshStandardMaterial({
  color,emissive,emissiveIntensity:1,
  roughness:.8
 });
}

function block(x,y,z,w,h,d,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(color)
 );
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

function glowSphere(x,y,z,r,color){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(r,14,12),
  material(color,color)
 );
 m.position.set(x,y,z);
 scene.add(m);
 return m;
}

// GROUND
block(0,-.3,-8,24,.5,45,0x413346);

// ROAD
block(0,-.03,-6,5,.08,40,0x75606b);

// ROAD DECORATION
for(let z=12;z>-24;z-=2){
 for(let x of [-2.4,2.4]){
  glowSphere(x,.12,z,.09,0xffb837);
 }
}

// STARS
for(let i=0;i<160;i++){
 glowSphere(
  (Math.random()-.5)*55,
  6+Math.random()*17,
  -20-Math.random()*35,
  .045,0xffffff
 );
}

// MOON
glowSphere(-11,14,-28,1.5,0xffe3a0);

// STREET HOUSES
const colors=[
 0xe56b58,0x6455ad,0xc87b42,
 0x318b88,0xb54f80
];

function smallHouse(x,z,color){
 block(x,1.4,z,3,2.8,3,color);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(2.4,1.5,4),
  material(0x9d382c)
 );
 roof.position.set(x,3.55,z);
 roof.rotation.y=Math.PI/4;
 scene.add(roof);

 for(let zz of [z-.8,z+.8]){
  const win=block(x-Math.sign(x)*1.52,2,zz,.08,.75,.65,0xffd06a);
  win.material.emissive.setHex(0xffb52b);
 }

 for(let i=0;i<6;i++){
  glowSphere(
   x-Math.sign(x)*1.55,2.9,
   z-1.2+i*.45,.07,0xffd04d
  );
 }
}

for(let i=0;i<5;i++){
 let z=7-i*5;
 smallHouse(-5,z,colors[i]);
 smallHouse(5,z,colors[(i+2)%5]);
}

// MAIN HOME
const houseX=0;
const houseZ=-17;

// Main building
const home=block(0,2.5,houseZ,9,5,4.5,0xc57a54);

// Roof
const roof=new THREE.Mesh(
 new THREE.ConeGeometry(6,3,4),
 material(0x8c312e)
);
roof.rotation.y=Math.PI/4;
roof.scale.set(1.2,1,1);
roof.position.set(0,6.5,houseZ);
scene.add(roof);

// Balcony
block(0,3.2,houseZ+2.35,8,.15,.3,0x633d35);
for(let x=-3.5;x<=3.5;x+=.5){
 block(x,3.7,houseZ+2.35,.07,1,.07,0xffd88a);
}

// Windows - initially dark
const windows=[];
for(let x of [-3,3]){
 for(let y of [2.7,4.7]){
  const w=block(x,y,houseZ+2.28,1.2,1.25,.1,0x201c35);
  windows.push(w);
 }
}

// Door
const door=block(0,1.5,houseZ+2.45,1.5,3,.2,0x592c27);
const knob=glowSphere(.48,1.5,houseZ+2.6,.09,0xffc957);

// HOME DECORATION LIGHTS
const houseBulbs=[];
for(let i=0;i<13;i++){
 const bulb=glowSphere(
  -4+i*.67,5.05,houseZ+2.4,.12,0x17152c
 );
 houseBulbs.push(bulb);
}

// House roof decorations
const roofLights=[];
for(let i=0;i<13;i++){
 const bulb=glowSphere(
  -3.8+i*.63,5.8,houseZ+2.2,.11,0x17152c
 );
 roofLights.push(bulb);
}

// HOUSE GATE
block(-2,1.15,-10,.15,2.3,.3,0x6b3b27);
block(2,1.15,-10,.15,2.3,.3,0x6b3b27);

const leftGate=new THREE.Group();
leftGate.position.set(-2,0,-10);
scene.add(leftGate);

const rightGate=new THREE.Group();
rightGate.position.set(2,0,-10);
scene.add(rightGate);

function createGate(parent,side){
 const panel=new THREE.Group();
 parent.add(panel);

 blockLocal(panel,side*.95,1.1,0,1.9,2.2,.18,0x934c32);

 for(let i=0;i<6;i++){
  blockLocal(
   panel,side*(.25+i*.28),1.1,.11,
   .06,2,.08,0xffd17c
  );
 }

 blockLocal(panel,side*.95,2.15,.12,1.9,.12,.25,0xffd17c);
 return panel;
}

function blockLocal(parent,x,y,z,w,h,d,color){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material(color)
 );
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

const leftPanel=createGate(leftGate,1);
const rightPanel=createGate(rightGate,-1);

// DIYAS
const diyaLights=[];
for(let x=-4;x<=4;x+=1){
 const bowl=glowSphere(x,.15,-9,.2,0xc66a28);
 const flame=glowSphere(x,.35,-9,.09,0xffc43c);
 const light=new THREE.PointLight(0xff9e2d,0,3);
 light.position.set(x,.5,-9);
 scene.add(light);
 diyaLights.push(light);
}

// RANGOLI
for(let i=0;i<12;i++){
 let a=i*Math.PI/6;
 glowSphere(
  Math.cos(a)*.75,.04,-8+Math.sin(a)*.75,
  .16,i%2?0xff5c9b:0xffd34e
 );
}

// FIREWORK SYSTEM
const fireworks=[];

function explode(x,y,z){
 const count=95;
 const pos=[];
 const velocity=[];

 for(let i=0;i<count;i++){
  pos.push(x,y,z);
  const a=Math.random()*Math.PI*2;
  const b=Math.random()*Math.PI;
  const s=2+Math.random()*4;

  velocity.push(
   Math.sin(b)*Math.cos(a)*s,
   Math.cos(b)*s,
   Math.sin(b)*Math.sin(a)*s
  );
 }

 const geo=new THREE.BufferGeometry();
 geo.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(pos,3)
 );

 const colors=[0xffc13b,0xff5cba,0x60dfff,0xffffff];
 const color=colors[Math.floor(Math.random()*4)];

 const mat=new THREE.PointsMaterial({
  color,size:.15,transparent:true,
  opacity:1,blending:THREE.AdditiveBlending
 });

 const particles=new THREE.Points(geo,mat);
 scene.add(particles);
 fireworks.push({particles,velocity,age:0});
}

function updateFireworks(dt){
 for(let i=fireworks.length-1;i>=0;i--){
  const f=fireworks[i];
  f.age+=dt;
  const p=f.particles.geometry.attributes.position.array;

  for(let j=0;j<p.length;j+=3){
   p[j]+=f.velocity[j/3*3]*dt;
   p[j+1]+=f.velocity[j/3*3+1]*dt;
   p[j+2]+=f.velocity[j/3*3+2]*dt;
   f.velocity[j/3*3+1]-=2*dt;
  }

  f.particles.geometry.attributes.position.needsUpdate=true;
  f.particles.material.opacity=Math.max(0,1-f.age/2.2);

  if(f.age>2.2){
   scene.remove(f.particles);
   f.particles.geometry.dispose();
   f.particles.material.dispose();
   fireworks.splice(i,1);
  }
 }
}

// CINEMATIC CAMERA
const startTime=performance.now();
let lastTime=0;
let lastFirework=0;

function ease(t){
 return t<0?0:t>1?1:t*t*(3-2*t);
}

function showCaption(text){
 const el=document.getElementById("caption");
 el.textContent=text;
 el.style.opacity=1;
 setTimeout(()=>el.style.opacity=0,2800);
}

// TIMELINE
function animate(){
 requestAnimationFrame(animate);

 const now=(performance.now()-startTime)/1000;
 const dt=Math.min(.04,Math.max(0,now-lastTime));
 lastTime=now;

 // SCENE 1: GALI
 if(now<5){
  const t=ease(now/5);
  camera.position.set(0,3.2,14-t*11);
  camera.lookAt(0,2,-14);
 }

 if(now>1 && now<4){
  showCaptionOnce("✨ A beautiful Diwali evening...");
 }

 // SCENE 2: GATE APPROACH
 if(now>=5 && now<9){
  let t=ease((now-5)/4);
  camera.position.set(0,3.2,3-t*7);
  camera.lookAt(0,2,-16);
 }

 // SCENE 3: GATE OPENS
 if(now>=9){
  const t=ease((now-9)/3);
  leftGate.rotation.y=t*-1.15;
  rightGate.rotation.y=t*1.15;
 }

 // SCENE 4: CAMERA ENTERS
 if(now>=9 && now<14){
  const t=ease((now-9)/5);
  camera.position.set(0,3.2,-4-t*6);
  camera.lookAt(0,2,-18);
 }

 // SCENE 5: HOUSE LIGHTS
 if(now>=14){
  const t=Math.min(1,(now-14)/3);

  windows.forEach((w,i)=>{
   if(now>14+i*.35){
    w.material.color.setHex(0xffd879);
    w.material.emissive.setHex(0xffb52b);
    w.material.emissiveIntensity=1.5;
   }
  });

  houseBulbs.forEach((b,i)=>{
   if(now>14+i*.16){
    b.material.color.setHex(0xffd13b);
    b.material.emissive.setHex(0xffc42b);
   }
  });

  roofLights.forEach((b,i)=>{
   if(now>15+i*.12){
    b.material.color.setHex(0xff75ad);
    b.material.emissive.setHex(0xff438b);
   }
  });

  diyaLights.forEach(l=>{
   l.intensity=Math.min(2,t*2);
  });

  homeLight.intensity=Math.min(35,t*35);
 }

 // SCENE 6: FIREWORKS
 if(now>=18 && now-lastFirework>1.15){
  lastFirework=now;
  explode(
   (Math.random()-.5)*14,
   8+Math.random()*6,
   -17-Math.random()*8
  );
 }

 // SCENE 7: FINAL MESSAGE
 if(now>=23){
  document.getElementById("final").style.opacity=1;
 }

 updateFireworks(dt);
 renderer.render(scene,camera);
}

let captionShown=false;
function showCaptionOnce(text){
 if(captionShown)return;
 captionShown=true;
 showCaption(text);
 setTimeout(()=>{
  captionShown=false;
 },4500);
}

document.getElementById("loading").style.display="none";
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
